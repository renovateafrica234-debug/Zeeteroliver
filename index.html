<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeeter Oliver | Official EPK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== COLOR & DESIGN VARIABLES ===== */
        :root {
            /* Exact Gradient Background Tones from UI */
            --bg-deep: #0a0a0a; /* Main backdrop */
            --tone-green: #083D2A; /* Upper-left atmosphere */
            --tone-orange: #662E1A; /* Lower-right warm fade */
            
            /* UI Element Colors */
            --accent: #e63946; /* Premium Red */
            --accent-hover: #ff4757;
            --text-main: #ffffff;
            --text-dim: rgba(255,255,255,0.7);
            --border: rgba(255,255,255,0.08);
            
            /* Exact Halo Ring Colors */
            --halo-cyan: #2AF5E6; /* Green/Blue Ring */
            --halo-copper: #F5A623; /* Orange/Gold Ring */
        }

        /* ===== RESET & BASE STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== PREMIUM UI GRADIENT BACKGROUND ===== */
        .page-bg {
            position: fixed; inset: 0; z-index: -10;
            background-color: var(--bg-deep);
            overflow: hidden;
        }
        /* Top-Left Green/Teal Tone */
        .page-bg::before {
            content: ''; position: absolute;
            width: 150vw; height: 150vh;
            top: -50vh; left: -50vw;
            background: radial-gradient(circle, var(--tone-green) 0%, transparent 70%);
            opacity: 0.8;
        }
        /* Bottom-Right Copper/Orange Tone */
        .page-bg::after {
            content: ''; position: absolute;
            width: 150vw; height: 150vh;
            bottom: -50vh; right: -50vw;
            background: radial-gradient(circle, var(--tone-orange) 0%, transparent 70%);
            opacity: 0.6;
        }

        /* ===== NAVIGATION (MODERN, GLASS) ===== */
        nav {
            position: fixed; top: 0; width: 100%; padding: 1.5rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10,10,10,0.8); backdrop-filter: blur(20px);
            z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .nav-logo {
            font-family: 'Space Grotesk', sans-serif; font-weight: 700;
            font-size: 1.2rem; text-decoration: none; color: #fff;
        }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 2rem; align-items: center; list-style: none; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: 600; }
        .nav-cta {
            background: var(--accent); padding: 0.6rem 1.2rem; border-radius: 8px;
            color: white; text-decoration: none; font-weight: 700; font-size: 0.8rem;
        }
        .nav-cta:hover { background: var(--accent-hover); transform: translateY(-2px); }

        /* ===== THE HERO SECTION (IMAGE + HALO) ===== */
        .hero {
            min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
            align-items: center; padding: 10rem 5% 5rem; max-width: 1400px; margin: 0 auto; gap: 4rem;
        }

        /* 1. ADVANCED CSS HALO RINGS EFFECT */
        .hero-image-side { position: relative; display: flex; justify-content: center; }
        .halo-rings-wrap {
            position: absolute; width: 130%; height: 130%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.9;
        }
        /* Inner Cyan/Green Ring */
        .ring-inner {
            position: absolute; width: 80%; height: 80%;
            border-radius: 50%;
            border: 4px solid var(--halo-cyan);
            filter: blur(8px) brightness(1.2);
            animation: ringPulse 10s ease-in-out infinite alternate;
        }
        /* Outer Copper/Gold Ring */
        .ring-outer {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            border: 4px solid var(--halo-copper);
            filter: blur(12px) brightness(1.1);
            animation: ringPulse 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.03); opacity: 1; }
        }

        /* Seated Figure Image */
        .profile-img-wrap {
            position: relative; z-index: 10; border-radius: 24px;
            overflow: hidden; border: 1px solid var(--border);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }
        .profile-img-wrap img {
            width: 100%; height: auto; display: block;
            max-width: 500px; object-fit: cover;
        }

        /* ===== HERO CONTENT SECTION ===== */
        .hero-content {
            z-index: 20; position: relative;
        }
        .badge {
            background: rgba(230, 57, 70, 0.15); color: var(--accent);
            padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.7rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px;
            margin-bottom: 2rem; display: inline-block;
        }
        
        /* 2. REPLACED HERO TITLE with her name */
        .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 700; line-height: 0.95;
            letter-spacing: -3px; margin-bottom: 2rem;
        }
        .hero-subtitle {
            font-size: 1.2rem; color: var(--text-dim);
            max-width: 600px; margin-bottom: 3rem;
        }
        .hero-cta { display: flex; gap: 1.5rem; }

        /* BUTTONS */
        .btn {
            padding: 1.2rem 2.5rem; border-radius: 12px; font-weight: 700;
            font-size: 0.9rem; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex; align-items: center; gap: 0.8rem;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(230,57,70,0.4);
        }
        .btn-ghost { border: 1px solid var(--border); color: white; }
        .btn-ghost:hover { background: rgba(255,255,255,0.05); }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
            .hero-image-side { grid-row: 1; }
            .badge { margin-top: 4rem; }
            .hero-title { font-size: 3.5rem; }
            .hero-cta { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="page-bg"></div>

    <nav>
        <a href="#" class="nav-logo">ZEETER <span>OLIVER</span></a>
        <ul class="nav-links">
            <li><a href="#music">MUSIC</a></li>
            <li><a href="#about">ABOUT</a></li>
            <li><a href="#press">PRESS</a></li>
            <li><a href="#booking" class="nav-cta">BOOKING</a></li>
        </ul>
    </nav>

    <section class="hero">
        
        <div class="hero-image-side">
            <div class="halo-rings-wrap">
                <div class="ring-inner"></div>
                <div class="ring-outer"></div>
            </div>
            <div class="profile-img-wrap">
                <img src="510488.jpg" alt="Zeeter Oliver | Premium Afrofusion Artist">
            </div>
        </div>

        <div class="hero-content">
            <div class="badge">AFROFUSION & TECH ENTREPRENEUR</div>
            
            <h1 class="hero-title">ZEETER <br><span style="color: var(--accent)">OLIVER</span></h1>
            
            <p class="hero-subtitle">
                Independent artist and tech-driven producer merging traditional African rhythms with futuristic electronic production. Shaping the sound of tomorrow.
            </p>
            
            <div class="hero-cta">
                <a href="#music" class="btn btn-primary">
                    <i class="fas fa-play"></i> LISTEN NOW
                </a>
                <a href="#contact" class="btn btn-ghost">
                    GET IN TOUCH
                </a>
            </div>
        </div>

    </section>

</body>
                                              </html>
