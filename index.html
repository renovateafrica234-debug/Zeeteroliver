<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeeter Oliver | Official EPK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-elevated: #111111;
            --bg-card: #161616;
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.4);
            --accent: #e63946;
            --accent-light: #ff6b7a;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* FIX 1: BACKGROUND DEPTH */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1; /* Send to back */
            background: var(--bg);
            pointer-events: none;
        }

        .mesh-bg::before {
            content: '';
            position: absolute;
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(230,57,70,0.12) 0%, transparent 70%);
            top: -20%; right: -10%;
            animation: meshFloat 15s ease-in-out infinite;
        }

        @keyframes meshFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* FIX 2: CONTENT VISIBILITY */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 8rem 5% 4rem;
            position: relative;
            z-index: 10; /* Bring to front */
        }

        .hero-content {
            max-width: 800px;
            opacity: 1 !important; /* Force visibility */
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(230,57,70,0.15);
            border: 1px solid var(--accent);
            border-radius: 50px;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 0.95;
            margin-bottom: 2rem;
            letter-spacing: -3px;
        }

        .highlight { color: var(--accent); }

        .btn-group { display: flex; gap: 1.5rem; margin-top: 3rem; }

        .btn {
            padding: 1.2rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(230,57,70,0.4); }

        .btn-ghost { border: 1px solid var(--border); color: white; }
        .btn-ghost:hover { background: rgba(255,255,255,0.05); }

        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
            background: rgba(10,10,10,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <nav>
        <div class="logo">ZEETER<span class="highlight">.</span></div>
        <div style="display: flex; gap: 2rem; align-items: center;">
            <a href="#" style="color: white; text-decoration: none; font-size: 0.8rem; font-weight: 600;">CATALOGUE</a>
            <a href="#" class="btn-primary" style="padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.8rem; text-decoration: none; color: white;">BOOKING</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge">Independent Artist & Entrepreneur</div>
            <h1>ZEETER <br><span class="highlight">OLIVER</span></h1>
            <p style="font-size: 1.2rem; color: var(--text-secondary); max-width: 600px;">
                Merging cutting-edge technology with minimalist premium sounds. Shaping the future of music through AI and authentic storytelling.
            </p>
            
            <div class="btn-group">
                <a href="#music" class="btn btn-primary">LISTEN NOW</a>
                <a href="#about" class="btn btn-ghost">VIEW EPK</a>
            </div>
        </div>
    </section>

</body>
    </html>
