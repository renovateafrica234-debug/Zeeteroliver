<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeeter Oliver | Official Shop</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== COLOR VARIABLES ===== */
        :root {
            --bg: #0a0a0a;
            --bg-elevated: #111111;
            --bg-card: #161616;
            --bg-glass: rgba(22,22,22,0.85);
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.3);
            --accent: #e63946;
            --accent-glow: rgba(230,57,70,0.3);
            --accent-light: #ff6b7a;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(230,57,70,0.3);
            --success: #00d084;
            --warning: #ffa502;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg);
            overflow: hidden;
        }

        .mesh-bg::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(230,57,70,0.12) 0%, transparent 70%);
            top: -20%;
            right: -10%;
            animation: meshFloat 15s ease-in-out infinite;
        }

        .mesh-bg::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(100,50,50,0.08) 0%, transparent 70%);
            bottom: -10%;
            left: -5%;
            animation: meshFloat 20s ease-in-out infinite reverse;
        }

        @keyframes meshFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* ===== NOISE TEXTURE ===== */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ===== NAVIGATION ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.2rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10,10,10,0.6);
            backdrop-filter: blur(30px) saturate(1.5);
            border-bottom: 1px solid var(--border);
            transition: all 0.4s ease;
        }

        nav.scrolled {
            background: rgba(10,10,10,0.9);
            padding: 0.8rem 4%;
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #ff4757);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: white;
        }

        .nav-logo-text {
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: all 0.3s;
            transform: translateX(-50%);
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ===== CART BUTTON ===== */
        .cart-btn {
            position: relative;
            padding: 0.6rem 1.2rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .cart-btn:hover {
            background: rgba(230,57,70,0.1);
            border-color: rgba(230,57,70,0.3);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cart-count.show {
            opacity: 1;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #c1121f);
            color: white;
            box-shadow: 0 8px 30px rgba(230,57,70,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(230,57,70,0.4);
        }

        .btn-ghost {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-3px);
        }

        /* ===== SHOP HERO ===== */
        .shop-hero {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10rem 4% 5rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .shop-hero-content {
            max-width: 800px;
            z-index: 2;
        }

        .shop-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.2);
            border-radius: 50px;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .shop-hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }

        .shop-hero h1 .highlight {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .shop-hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        /* ===== TABS ===== */
        .shop-tabs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .tab-btn {
            padding: 0.8rem 1.8rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        /* ===== SECTIONS ===== */
        section {
            padding: 4rem 4%;
            position: relative;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .section-label::before {
            content: '';
            width: 20px;
            height: 1px;
            background: var(--accent);
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .section-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        .section-header {
            margin-bottom: 3rem;
        }

        /* ===== PRODUCT CARDS ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-image {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #1a0a0a, #2a0a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image-gradient {
            position: absolute;
            inset: 0;
            opacity: 0.5;
        }

        .product-card:nth-child(3n+1) .product-image-gradient {
            background: linear-gradient(135deg, rgba(230,57,70,0.25), rgba(100,20,20,0.15));
        }

        .product-card:nth-child(3n+2) .product-image-gradient {
            background: linear-gradient(135deg, rgba(50,20,80,0.25), rgba(20,10,40,0.15));
        }

        .product-card:nth-child(3n+3) .product-image-gradient {
            background: linear-gradient(135deg, rgba(20,80,60,0.25), rgba(10,40,30,0.15));
        }

        .product-art {
            width: 100px;
            height: 100px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .product-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 8px;
            z-index: 3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-badge.sold-out {
            background: var(--text-muted);
        }

        .product-badge.preorder {
            background: var(--warning);
            color: var(--bg);
        }

        .product-info {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }

        .product-info .product-meta {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .product-price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .product-price .original {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 1rem;
            margin-left: 0.5rem;
            font-weight: 400;
        }

        .product-desc {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        .add-to-cart {
            flex: 1;
            padding: 0.8rem;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .add-to-cart:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230,57,70,0.3);
        }

        .add-to-cart:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .wishlist-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wishlist-btn:hover {
            background: rgba(230,57,70,0.1);
            border-color: rgba(230,57,70,0.3);
            color: var(--accent);
        }

        /* ===== EVENT CARDS ===== */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .event-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s;
            display: flex;
            flex-direction: column;
        }

        .event-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .event-header {
            padding: 1.5rem 1.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .event-date {
            text-align: center;
            padding: 0.8rem 1rem;
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.2);
            border-radius: 12px;
        }

        .event-date .day {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .event-date .month {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .event-status {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .event-status.available {
            background: rgba(0,208,132,0.1);
            color: var(--success);
            border: 1px solid rgba(0,208,132,0.2);
        }

        .event-status.limited {
            background: rgba(255,165,2,0.1);
            color: var(--warning);
            border: 1px solid rgba(255,165,2,0.2);
        }

        .event-status.sold-out {
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .event-body {
            padding: 1.5rem;
        }
